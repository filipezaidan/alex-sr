    <rect x="1174" y="274" width="370" height="36" fill="#e7f5ff"/>
    <text x="1188" y="297" fill="#212529" font-size="13">DMZ</text>
    <text x="1280" y="297" fill="#212529" font-size="13">10.0.2.0/24</text>
    <text x="1410" y="297" fill="#212529" font-size="13">10.0.2.1 eth1</text>

    <rect x="1174" y="310" width="370" height="36" fill="#fff4e6"/>
    <text x="1188" y="333" fill="#212529" font-size="13">Ger&#234;ncia</text>
    <text x="1280" y="333" fill="#212529" font-size="13">10.0.3.0/24</text>
    <text x="1410" y="333" fill="#212529" font-size="13">10.0.3.1 eth2</text>

    <text x="1174" y="386" fill="#0b3a4a" font-size="18" font-weight="700">Interfaces do fw</text>
    <text x="1174" y="416" fill="#2b8a3e" font-size="14">eth0  cabo A  LAN  10.0.1.1/24</text>
    <text x="1174" y="440" fill="#1864ab" font-size="14">eth1  cabo B  DMZ  10.0.2.1/24</text>
    <text x="1174" y="464" fill="#d9480f" font-size="14">eth2  cabo C  ger&#234;ncia  10.0.3.1/24</text>
    <text x="1174" y="488" fill="#364fc7" font-size="14">eth3  cabo D  r0  198.51.100.1/30</text>

    <text x="1174" y="536" fill="#0b3a4a" font-size="18" font-weight="700">FORWARD vigente</text>
    <text x="1174" y="564" fill="#212529" font-size="14">Pol&#237;tica padr&#227;o: DROP</text>
    <text x="1174" y="590" fill="#2b8a3e" font-size="14">Respostas ESTABLISHED,RELATED</text>
    <text x="1174" y="614" fill="#2b8a3e" font-size="14">LAN para DMZ, eth0 para eth1</text>
    <text x="1174" y="638" fill="#2b8a3e" font-size="14">LAN para Internet, eth0 para eth3</text>
    <text x="1174" y="662" fill="#2b8a3e" font-size="14">Internet para DMZ, TCP/80</text>
    <text x="1174" y="686" fill="#2b8a3e" font-size="14">DMZ para Internet, DNS/53</text>
    <text x="1174" y="710" fill="#c92a2a" font-size="14">Internet para LAN: bloqueado</text>
    <text x="1174" y="734" fill="#c92a2a" font-size="14">DMZ para LAN, sess&#227;o nova: bloqueado</text>

    <rect x="1174" y="768" width="370" height="140" rx="12" fill="#f8f9fa" stroke="#dee2e6"/>
    <text x="1194" y="800" fill="#0b3a4a" font-size="15" font-weight="700">Servi&#231;os ligados</text>
    <text x="1194" y="828" fill="#212529" font-size="13">web sobe HTTP na porta 80.</text>
    <text x="1194" y="852" fill="#212529" font-size="13">dns usa dnsmasq e encaminha a 8.8.8.8.</text>
    <text x="1194" y="876" fill="#212529" font-size="13">r0 faz NAT na interface bridged.</text>
    <text x="1194" y="900" fill="#868e96" font-size="13">Ainda sem Squid e sem NGINX.</text>
  </g>
