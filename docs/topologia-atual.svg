    <linearGradient id="fwg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#c92a2a"/>
    </linearGradient>
    <linearGradient id="lanH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f9e44"/>
      <stop offset="1" stop-color="#2b8a3e"/>
