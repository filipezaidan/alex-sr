# Proxy explícito. O cliente fala com este endereço; o Squid busca o site.
# Sem a palavra intercept: não é proxy transparente.
http_port 10.0.1.20:3128

visible_hostname proxy

# Quem pode usar o proxy. Primeira regra que casa decide.
acl lan src 10.0.1.0/24

# Destinos que o encaminhamento aceita.
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# Fora dessas portas, nega. CONNECT (HTTPS) só na 443.
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# A LAN passa. Qualquer outra origem para aqui.
http_access allow lan
http_access deny all

cache_effective_user proxy
cache_effective_group proxy
cache_dir ufs /var/spool/squid 100 16 256
coredump_dir /var/spool/squid

# Última regra de frescor: permite guardar resposta e reutilizá-la.
refresh_pattern . 0 20% 4320
