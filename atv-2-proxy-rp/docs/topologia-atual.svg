    <text x="1440" y="152" fill="#0b3a4a" font-size="18" font-weight="700">Nos novos</text>
    <text x="1440" y="180" fill="#2b8a3e" font-size="14">proxy  10.0.1.20/24  cabo A</text>
    <text x="1440" y="204" fill="#1864ab" font-size="14">rp  10.0.2.20/24  cabo B</text>
    <text x="1440" y="228" fill="#495057" font-size="13">web continua em 10.0.2.10.</text>
    <text x="1440" y="252" fill="#495057" font-size="13">Squid e NGINX ainda nao sobem.</text>

    <text x="1440" y="296" fill="#0b3a4a" font-size="18" font-weight="700">Interfaces do fw</text>
    <text x="1440" y="324" fill="#2b8a3e" font-size="14">eth0  cabo A  LAN  10.0.1.1/24</text>
    <text x="1440" y="348" fill="#1864ab" font-size="14">eth1  cabo B  DMZ  10.0.2.1/24</text>
