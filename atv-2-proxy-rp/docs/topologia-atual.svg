    <text x="1440" y="396" fill="#364fc7" font-size="14">eth3  cabo D  r0  198.51.100.1/30</text>

    <text x="1440" y="440" fill="#0b3a4a" font-size="18" font-weight="700">O que o teste mostrou</text>
    <text x="1440" y="468" fill="#2b8a3e" font-size="14">proxy alcanca pc1 no cabo A.</text>
    <text x="1440" y="492" fill="#1864ab" font-size="14">rp alcanca web no cabo B.</text>
    <text x="1440" y="516" fill="#c92a2a" font-size="14">Ping ao IP do fw cai na INPUT.</text>
    <text x="1440" y="540" fill="#495057" font-size="13">Esse trecho nao passa pela FORWARD.</text>

    <text x="1440" y="584" fill="#0b3a4a" font-size="18" font-weight="700">FORWARD ainda da atividade 1</text>
    <text x="1440" y="612" fill="#212529" font-size="14">Pol&#237;tica padr&#227;o: DROP</text>
    <text x="1440" y="636" fill="#2b8a3e" font-size="14">LAN para Internet, eth0 para eth3</text>
    <text x="1440" y="660" fill="#2b8a3e" font-size="14">Internet para DMZ, TCP/80</text>
    <text x="1440" y="684" fill="#c92a2a" font-size="14">Essa regra ainda alcanca o web direto.</text>

    <rect x="1440" y="720" width="372" height="180" rx="12" fill="#f8f9fa" stroke="#dee2e6"/>
    <text x="1460" y="752" fill="#0b3a4a" font-size="15" font-weight="700">Fluxo previsto</text>
    <text x="1460" y="780" fill="#212529" font-size="13">Saida: pc para proxy para fw para Internet.</text>
    <text x="1460" y="804" fill="#212529" font-size="13">Entrada: Internet para fw para rp para web.</text>
    <text x="1460" y="828" fill="#495057" font-size="13">proxy e pc ficam no mesmo cabo.</text>
    <text x="1460" y="852" fill="#495057" font-size="13">rp e web tambem. O fw nao ve esse salto.</text>
    <text x="1460" y="876" fill="#868e96" font-size="13">O bloqueio do web direto vem no NGINX.</text>
  </g>
